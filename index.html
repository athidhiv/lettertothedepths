<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ocean Demon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <!-- SKY -->
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
    </div>
    <!-- DEMON SVG -->
      <div class="demon">
        <svg width="300" height="250" viewBox="0 0 150 150">
          <!-- Head -->
          <circle cx="75" cy="75" r="40" fill="purple" stroke="#000" stroke-width="3"/>
            <!-- Body -->
          <ellipse cx="75" cy="155" rx="50" ry="40" fill="purple" stroke="#000" stroke-width="3"/>
          <!-- Horns -->
          <polygon points="50,55 55,50 50,25" fill="purple" stroke="#000" stroke-width="2" />
          <polygon points="100,55 95,50 100,25" fill="purple" stroke="#000" stroke-width="2" />

          <!-- Eyes (Blinking) -->
          <circle class="eye" cx="60" cy="75" r="8" fill="#fff"/>
          <circle class="eye" cx="90" cy="75" r="8" fill="#fff"/>
          <circle cx="60" cy="75" r="4" fill="#000"/>
          <circle cx="90" cy="75" r="4" fill="#000"/>

          <!-- Hands (Waving) -->
          <ellipse class="hand left" cx="25" cy="130" rx="15" ry="10" fill="purple"/>
                               
          <ellipse class="hand right" cx="140" cy="130" rx="15" ry="10" fill="purple"/>

          <!-- Mouth -->
          <path d="M60 95 Q75 105 95 100" stroke="#000" stroke-width="2" fill="none"/>
        </svg>
      </div>
    <!-- OCEAN -->
    <div class="ocean">
      <div class="wave"><img src="/assets/wave.png" alt=""></div>
      <div class="bottle" id="bottle"><img src="/assets/glassbottle.png" alt="                                                         
        Bottle with a message" /></div>
      </div>
    </div>
  </div>
  <div id="message-section"></div>

<!-- OPTIONS TEMPLATE -->
  <template id="options-template">
    <p class="message-text letter-text"></p>

    <div class="actions">
        <p class="action-text btn-resend">Send to someone else</p>
        <p class="action-text btn-reply">Reply</p>
        <p class="action-text btn-new">Write your own</p>
    </div>
</template>


<!-- WRITE TEMPLATE -->
<template id="write-template">
    <div id="letter"
         class="letter-input"
         contenteditable="true"
         spellcheck="true"
         data-placeholder="Write your letter here...">
    </div>

    <p class="action-text" id="btn-submit">Throw into Sea</p>
</template>


<!-- REPLY TEMPLATE -->
<template id="reply-template">
    <p class="replying-to letter-text"></p>

    <div id="reply-text"
         class="letter-input"
         contenteditable="true"
         spellcheck="true"
         data-placeholder="Your reply...">
    </div>

    <p class="action-text" id="btn-submit-reply">Send Reply</p>
</template>

  <script src="index.js"></script>
</body>
</html>
